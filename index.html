<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Grokbot AI log</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Theme before first paint: no flash. Stored: 'light' | 'dark' | 'system'; first visit = dark. Unknown → dark. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('grokbot-ai-log:theme') || 'dark';
          var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
          var light = pref === 'light' || (pref === 'system' && mq && mq.matches);
          var root = document.documentElement;
          root.classList.add(light ? 'light' : 'dark');
          root.style.colorScheme = light ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#f6f7f9' : '#0b0d10');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
